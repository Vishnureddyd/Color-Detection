<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autism Detection | Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(to right, #7da8ec, #9defd5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: url('/static/3.jpg');
      background-position: 0 0, 25px 25px;
      background-size: 690px 690px;
    }

    nav {
      width: 100%;
      background-color: rgba(102, 214, 255, 0.815);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      padding: 15px 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 15;
      height: 60px;
      border-radius: 0 0 20px 20px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    nav ul li a {
      text-decoration: none;
      color: #000000;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    nav ul li a:hover {
      background-color: #4a90e2;
      color: rgb(0, 0, 0);
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.5);
    }

    .contact-container {
      background: rgba(248, 255, 149, 0.815);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0 0 0 / 0.15);
      width: 100%;
      max-width: 480px;
      margin-top: 45px;
      border: 1px solid rgba(255 255 255 / 0.4);
      color: #222;
    }

    .contact-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 700;
      color: #222;
      text-shadow: 0 1px 4px rgba(143, 143, 143, 0.7);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #222;
      text-shadow: 0 1px 1px rgba(152, 152, 152, 0.6);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid rgba(235, 235, 235, 0.5);
      border-radius: 12px;
      font-size: 16px;
      transition: border-color 0.3s, box-shadow 0.3s;
      background-color: rgba(255 255 255 / 0.8);
      color: #222;
      box-shadow: inset 0 2px 6px rgba(0 0 0 / 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    input::placeholder, textarea::placeholder {
      color: #666;
      opacity: 0.7;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 12px rgba(74, 144, 226, 0.6);
      background-color: #fff;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #4a90e2;
      color: white;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 5px 15px rgba(74, 144, 226, 0.5);
    }

    .submit-btn:hover {
      background-color: #357abd;
      box-shadow: 0 8px 22px rgba(53, 122, 189, 0.75);
    }

    @media (max-width: 480px) {
      .contact-container {
        margin: 40px 20px;
        padding: 30px 20px;
      }
      nav ul {
        gap: 15px;
      }
      nav ul li a {
        padding: 6px 10px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/register">Register</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/about">About</a></li>
    </ul>
  </nav>

  <!-- Contact Form -->
  <div class="contact-container">
    <h2>Contact Us</h2>
    <form method="POST">


      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="input-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>
</body>
</html>
