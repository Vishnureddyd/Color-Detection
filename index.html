<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Color Detection</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

  :root {
    --color-primary: #1e90ff;
    --color-secondary: #2c3e50;
    --color-accent: #fb2b2b;
    --bg-gradient-start: #f0f4f8;
    --bg-gradient-end: #d9e2ec;
    --btn-bg: rgba(255 255 255 / 0.7);
    --btn-hover-bg: rgba(255 255 255 / 0.9);
    --btn-shadow: rgba(0, 0, 0, 0.1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

body {
  font-family: 'Poppins', sans-serif;
  background-image: url('/static/6.jpg');
  background-size: cover;       /* Make image cover entire viewport */
  background-position: center;  /* Center the image */
  background-repeat: no-repeat; /* Prevent image tiling */
  position: relative;
  color: var(--color-secondary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 3rem 2rem;
  /* Optional: add a dark overlay for readability */
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 255, 255, 0.112);  /* semi-transparent overlay */
  z-index: -1;  /* behind the content */
}

  h1 {
    font-weight: 600;
    font-size: 3.8rem;
    background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
    margin-bottom: 3rem;
    margin-right: -400px;
  }

  .nav-links {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 600px;
    margin-right: -400px;
  }

  .nav-links a {
    background: var(--btn-bg);
    color: var(--color-secondary);
    padding: 1rem 2.5rem;
    font-weight: 600;
    font-size: 1.1rem;
    text-decoration: none;
    border-radius: 35px;
    box-shadow: 0 6px 12px var(--btn-shadow);
    transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.25s ease;
    user-select: none;
  }

  .nav-links a:hover,
  .nav-links a:focus {
    background: var(--btn-hover-bg);
    box-shadow: 0 12px 24px rgba(30, 144, 255, 0.25);
    transform: translateY(-4px);
    outline: none;
  }

  @media (max-width: 768px) {
    h1 {
      font-size: 2.8rem;
      margin-bottom: 2rem;
    }
    .nav-links a {
      padding: 0.85rem 2rem;
      font-size: 1rem;
    }
  }

  @media (max-width: 480px) {
    h1 {
      font-size: 2.4rem;
    }
    .nav-links {
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }
    .nav-links a {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>
<body>

  <h1>Color Detection</h1>

  <nav class="nav-links">
    <a href="/login" aria-label="Login">Login</a>
    <a href="/register" aria-label="Register">Register</a>
    <a href="/about" aria-label="About">About</a>
    <a href="/contact" aria-label="Contact">Contact</a>
    <a href="/predict" aria-label="Predict">Prediction</a>

  </nav>

</body>
</html>
